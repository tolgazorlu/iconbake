name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npx -y pnpm@9.15.9 install --frozen-lockfile
      - run: npx -y pnpm@9.15.9 typecheck:cli
      - run: npx -y pnpm@9.15.9 build
      - run: npx -y pnpm@9.15.9 test
